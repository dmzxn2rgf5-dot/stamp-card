# Config used only by the test suite (npm test). No real IDs: tests run on a local, in-memory D1.
name = "stamp-card-test"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "public"

[vars]
SHOP_ID = "main"
TIMEZONE = "Europe/London"

[[d1_databases]]
binding = "DB"
database_name = "stamp-card-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
